name: Instagram daily post

on:
  schedule:
    - cron: "41 9 * * *"   # 18:41 JST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = list what would be posted, post nothing"
        default: "0"

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post due items
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 scripts/post_instagram.py
      - name: Save posted.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted.json" && git push)
